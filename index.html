<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Findable Check</title>
<style>
:root{--ink:#161616;--green:#194D36;--coral:#E8543A;--cream:#F6F1E8;--paper:#FBF8F1;--grey:#6F685D;--line:#D9D1C3;--tg:#E2EAE1;--tc:#F8E1D9;--amber:#B7791F;--ta:#F6EBD5}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,Helvetica,sans-serif;font-size:16px;line-height:1.5}
header{max-width:1180px;margin:0 auto;padding:28px 20px 18px;border-bottom:1px solid var(--ink);position:relative}
.kicker{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--coral)}
h1{font-family:Georgia,serif;font-weight:400;font-size:clamp(32px,5.5vw,54px);line-height:1.05;margin:8px 0 6px}
h1 b{font-family:"Arial Black",Arial,sans-serif;font-weight:900;color:var(--coral);display:block;font-size:.82em;letter-spacing:-.01em}
.lead{max-width:62ch;margin:0;color:var(--grey)}
.langs{position:absolute;top:26px;right:20px;display:flex;gap:4px}
.langs button{font:700 11px/1 Arial;letter-spacing:.12em;border:1px solid var(--line);background:var(--paper);color:var(--grey);padding:7px 10px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
@media(max-width:640px){.langs{position:static;margin-bottom:12px}}
main{max-width:1180px;margin:0 auto;padding:22px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
@media(max-width:900px){main{grid-template-columns:1fr}}
.card{background:var(--paper);border:1px solid var(--line);padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 3px 10px rgba(0,0,0,.06)}
label{display:block;font-weight:700;font-size:14px;margin-bottom:2px}
.hint{font-family:Georgia,serif;font-style:italic;color:var(--grey);font-size:14px;margin:0 0 8px}
input,textarea{width:100%;font:16px/1.45 Arial,sans-serif;padding:10px 11px;border:1px solid var(--line);background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:2px solid var(--green);outline-offset:0}
textarea{min-height:92px;resize:vertical}
.count{font-size:12px;color:var(--grey);text-align:right;margin-top:3px}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
button.btn{font:700 13px/1 Arial;letter-spacing:.06em;padding:11px 14px;border:1px solid var(--ink);background:var(--ink);color:#fff;cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button.btn:focus-visible{outline:2px solid var(--coral);outline-offset:2px}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.score{padding:16px;border:1px solid var(--line);background:var(--paper)}
.score .lab{font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--grey)}
.score .num{font-family:"Arial Black",Arial,sans-serif;font-size:42px;line-height:1.1}
.score .verdict{font-family:Georgia,serif;font-style:italic;font-size:15px}
.score.good .num{color:var(--green)} .score.mid .num{color:var(--amber)} .score.low .num{color:var(--coral)}
h2{font-size:12px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;margin:18px 0 8px;color:var(--green)}
h2.ai{color:var(--coral)}
ul.checks{list-style:none;margin:0;padding:0}
ul.checks li{display:grid;grid-template-columns:30px 1fr;gap:8px;padding:10px 12px;margin-bottom:8px;border-left:4px solid var(--line);background:var(--paper)}
li.pass{border-color:var(--green)} li.warn{border-color:var(--amber)} li.fail{border-color:var(--coral)}
.badge{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:13px;color:#fff}
li.pass .badge{background:var(--green)} li.warn .badge{background:var(--amber)} li.fail .badge{background:var(--coral)}
.ctitle{font-weight:700}
.cwhy{font-size:14px;color:var(--grey)}
.ctip{font-family:Georgia,serif;font-style:italic;font-size:14.5px;margin-top:3px}
.tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.1em;padding:1px 6px;margin-left:6px;vertical-align:2px;border:1px solid var(--line);color:var(--grey)}
.tag.g{border-color:var(--green);color:var(--green)}.tag.a{border-color:var(--coral);color:var(--coral)}
h2.part{color:var(--ink)}
pre.prop{white-space:pre-wrap;font:14px/1.5 Georgia,serif;background:#fff;border:1px solid var(--line);padding:12px 14px;margin:6px 0 8px;max-height:420px;overflow:auto}
.empty{font-family:Georgia,serif;font-style:italic;color:var(--grey);padding:24px 4px}
.note{font-size:13px;color:var(--grey);border-top:1px solid var(--line);margin-top:16px;padding-top:10px}
mark{background:var(--ta);padding:0 2px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.chip{font-size:12px;padding:2px 7px;border:1px solid var(--line);background:#fff}
.chip.hit{border-color:var(--green);background:var(--tg)}
.chip.miss{border-color:var(--coral);background:var(--tc)}
footer{max-width:1180px;margin:0 auto;padding:0 20px 30px;font-size:12px;color:var(--grey)}
</style>
</head>
<body>
<header>
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="en" aria-pressed="true">EN</button>
    <button type="button" data-lang="es" aria-pressed="false">ES</button>
  </div>
  <div class="kicker" data-i18n="kicker"></div>
  <h1><span data-i18n="h1a"></span><b data-i18n="h1b"></b></h1>
  <p class="lead" data-i18n="lead"></p>
</header>
<main>
  <section aria-label="Your page">
    <div class="card"><label for="q" data-i18n="qL"></label><p class="hint" data-i18n="qH"></p><input id="q" type="text" autocomplete="off"></div>
    <div class="card"><label for="brand" data-i18n="bL"></label><p class="hint" data-i18n="bH"></p><input id="brand" type="text" autocomplete="off"></div>
    <div class="card"><label for="title" data-i18n="tL"></label><p class="hint" data-i18n="tH"></p><input id="title" type="text" autocomplete="off"><div class="count" id="tCount"></div></div>
    <div class="card"><label for="intro" data-i18n="iL"></label><p class="hint" data-i18n="iH"></p><textarea id="intro"></textarea></div>
    <div class="card"><label for="body" data-i18n="dL"></label><p class="hint" data-i18n="dH"></p><textarea id="body" style="min-height:220px"></textarea></div>
    <div class="card"><label for="faq" data-i18n="fL"></label><p class="hint" data-i18n="fH"></p><textarea id="faq" style="min-height:110px"></textarea></div>
    <div class="row">
      <button type="button" class="btn" id="run" data-i18n="run"></button>
      <button type="button" class="btn ghost" id="exBad" data-i18n="exBad"></button>
      <button type="button" class="btn ghost" id="exGood" data-i18n="exGood"></button>
      <button type="button" class="btn ghost" id="clear" data-i18n="clear"></button>
    </div>
  </section>
  <section aria-label="Result" aria-live="polite">
    <div id="empty" class="empty" data-i18n="empty"></div>
    <div id="out" hidden>
      <div class="scores">
        <div class="score" id="sSeo"><div class="lab" data-i18n="forG"></div><div class="num"></div><div class="verdict"></div></div>
        <div class="score" id="sAi"><div class="lab" data-i18n="forA"></div><div class="num"></div><div class="verdict"></div></div>
      </div>
      <div class="card" style="padding:12px 14px"><div class="ctitle" data-i18n="kw"></div><div class="cwhy" data-i18n="kwH"></div><div class="chips" id="chips"></div></div>
      <h2 class="part" data-i18n="p1"></h2><ul class="checks" id="l1"></ul>
      <h2 class="part" data-i18n="p2"></h2><ul class="checks" id="l2"></ul>
      <h2 class="part" data-i18n="p3"></h2><ul class="checks" id="l3"></ul>
      <h2 class="part" data-i18n="p4"></h2>
      <div class="card"><div class="ctitle" data-i18n="aiT"></div><div class="cwhy" data-i18n="aiHint"></div><pre class="prop" id="aiPrompt"></pre>
        <div class="row"><button type="button" class="btn ghost" data-copy="aiPrompt" data-i18n="copyPrompt"></button></div></div>
      <div class="row"><button type="button" class="btn" id="copy" data-i18n="copy"></button><span id="copied" class="cwhy" hidden data-i18n="copied"></span></div>
      <p class="note" data-i18n="note"></p>
    </div>
  </section>
</main>
<footer data-i18n="foot"></footer>

const VAGUE=["innovative","innovation","unique","passion","passionate","world-class","best-in-class","cutting-edge","leading","high quality","excellence","solutions","journey","story","believe","experience","experiences","revolutionary","amazing","perfect",
"innovador","innovadora","innovación","único","única","pasión","apasionados","líder","líderes","excelencia","soluciones","calidad superior","alta calidad","experiencia única","historia","creemos","revolucionario","increíble","perfecto","perfecta"];
let lang="en";const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[¿?¡!.,;:()"“”'’«»\-–—\/#·|]/g," ");
const words=s=>norm(s).split(/\s+/).filter(Boolean);
const keyWords=q=>[...new Set(words(q).filter(w=>!STOP.has(w)&&(w.length>2||/\d/.test(w))))];
const stem=w=>w.length>5?w.slice(0,5):w;
const has=(t,w)=>words(t).some(x=>x===w||(w.length>3&&stem(x)===stem(w)));
const sentences=s=>s.split(/(?<=[.!?])\s+|\n+/).map(x=>x.trim()).filter(Boolean);
const fmt=(t,o)=>t.replace(/\{(\w+)\}/g,(_,k)=>o[k]);
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const isList=l=>/^\s*([-•*]|\d+[.)])\s+/.test(l);
function parse(body){
 const ls=body.split("\n").map(x=>x.trim()).filter(Boolean),out=[];
 ls.forEach((l,i)=>{let type="p";
  if(isList(l)) type="li";
  else if(/^#/.test(l)) type="h";
  else if(words(l).length<=10&&!/[.:;,]$/.test(l)&&ls[i+1]&&!/^(escrit[oa] por|written by|actualizad|updated)/i.test(l)) type="h";
  out.push({type,text:l.replace(/^#+\s*/,"")});});
 return out;}
function setLang(l){lang=l;document.documentElement.lang=l;
 document.querySelectorAll("[data-i18n]").forEach(el=>{const v=T[l][el.dataset.i18n];if(typeof v==="string")el.textContent=v;});
 document.querySelectorAll("[data-copy]").forEach(b=>b.onclick=async()=>{const t=$(b.dataset.copy).textContent;try{await navigator.clipboard.writeText(t)}catch(e){}const o=b.textContent;b.textContent="✓";setTimeout(()=>b.textContent=o,1200);});
document.querySelectorAll(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
 try{localStorage.setItem("fc-lang",l)}catch(e){}
 tCount();if(!$("out").hidden)run();}
function tCount(){$("tCount").textContent=$("title").value.length+" "+T[lang].chars;}
function run(){
 const L=T[lang],q=$("q").value.trim(),brand=$("brand").value.trim(),title=$("title").value.trim(),intro=$("intro").value.trim(),body=$("body").value.trim(),faq=$("faq").value.trim();
 if(!q||!title||!intro){alert(L.need);return false;}
 const P=parse(body),H=P.filter(x=>x.type==="h"),PAR=P.filter(x=>x.type==="p"),LI=P.filter(x=>x.type==="li");
 const all=[title,intro,body,faq].join(" "),kws=keyWords(q),visible=title+" "+intro+" "+H.map(h=>h.text).join(" "),hits=kws.filter(w=>has(visible,w));
 const first=sentences(intro)[0]||"",firstW=words(first).length,firstHit=kws.some(w=>has(first,w));
 const R={1:[],2:[],3:[]};
 const add=(part,key,st,tags,o)=>{const c=L.c[key];R[part].push({st,tags,title:c[0],why:fmt(c[1],o||{}),tip:st==="pass"?"":c[2]});};
 // 1 · top
 const ratio=kws.length?hits.length/kws.length:0;
 add(1,"words",ratio>=.6?"pass":ratio>=.3?"warn":"fail","g",{h:hits.length,n:kws.length});
 const tl=title.length;add(1,"titleLen",tl>=20&&tl<=65?"pass":tl<=80?"warn":"fail","g",{n:tl});
 let sT=firstHit?L.s.firstHas:L.s.firstNo;if(firstW>30)sT+=" · "+fmt(L.s.firstLong,{n:firstW});
 add(1,"answer",firstHit&&firstW<=30?"pass":firstHit?"warn":"fail","ga",{s:sT});
 const iw=words(intro).length,ik=sentences(intro).length;
 add(1,"summary",iw<=60&&ik<=3&&firstHit?"pass":iw<=90?"warn":"fail","a",{n:iw,k:ik});
 const qh=/\?\s*$/.test(title)||/^¿/.test(title);add(1,"qHead",qh?"pass":"warn","a",{s:qh?L.s.qYes:L.s.qNo});
 let st,sx;if(!brand){st="warn";sx=L.s.brandMissing}else{const ok=norm(first).includes(norm(brand).trim());st=ok?"pass":"fail";sx=fmt(ok?L.s.brandYes:L.s.brandNo,{b:brand});}
 add(1,"standalone",st,"a",{s:sx});
 // 2 · article
 add(2,"heads",H.length>=3?"pass":H.length>=1?"warn":"fail","ga",{n:H.length});
 const hw=H.filter(h=>/\?\s*$/.test(h.text)||/^¿/.test(h.text)||kws.some(w=>has(h.text,w))).length;
 add(2,"hWords",H.length&&hw>=Math.max(1,Math.ceil(H.length/2))?"pass":hw>=1?"warn":"fail","g",{n:hw});
 let ans=0;P.forEach((x,i)=>{if(x.type!=="h")return;const nx=P[i+1];if(nx&&((nx.type==="p"&&words(sentences(nx.text)[0]||"").length<=25)||nx.type==="li"))ans++;});
 add(2,"hAnswer",H.length&&ans/H.length>=.7?"pass":ans>=1?"warn":"fail","a",{a:ans,n:H.length});
 const maxP=PAR.reduce((m,x)=>Math.max(m,words(x.text).length),0);
 add(2,"para",maxP<=80?"pass":maxP<=120?"warn":"fail","g",{n:maxP});
 const bw=words(body).length;add(2,"depth",bw>=100?"pass":bw>=50?"warn":"fail","g",{n:bw});
 add(2,"lists",LI.length>=3?"pass":LI.length>=1?"warn":"fail","a",{n:LI.length});
 const nums=(all.match(/\d+([.,]\d+)?/g)||[]).length;add(2,"facts",nums>=5?"pass":nums>=2?"warn":"fail","ga",{n:nums});
 const low=" "+norm(all)+" ",vag=VAGUE.filter(v=>low.includes(" "+norm(v).trim()+" "));
 const AW=words(all),cnt=w=>AW.filter(x=>x===w||(w.length>3&&stem(x)===stem(w))).length;let mw="",mc=0;kws.forEach(w=>{const c=cnt(w);if(c>mc){mc=c;mw=w}});
 const dens=AW.length?mc/AW.length:0,tRep=kws.some(w=>words(title).filter(x=>x===w||(w.length>3&&stem(x)===stem(w))).length>=2);
 const nst=(dens>.06&&mc>=6)?"fail":((dens>.035&&mc>=5)||tRep)?"warn":"pass";
 if(mc===0){R[2].push({st:"pass",tags:"g",title:L.c.natural[0],why:L.s.noKw,tip:""})}else add(2,"natural",nst,"g",{w:mw,n:mc,p:Math.round(dens*1000)/10,t:tRep?L.s.tRep:""});
 add(2,"vague",vag.length===0?"pass":vag.length<=2?"warn":"fail","g",{list:vag.length?vag.join(", "):L.s.none});
 const ss=sentences(intro+"\n"+PAR.map(p=>p.text).join("\n")),avg=ss.length?Math.round(ss.reduce((a,x)=>a+words(x).length,0)/ss.length):0;
 add(2,"short",avg<=20?"pass":avg<=28?"warn":"fail","a",{n:avg});
 const author=/(escrit[oa] por|written by|\bby\b|\bpor\b|autor|author|equipo|team)/i.test(body),date=/(actualizad|updated|\b20\d\d\b|enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre|january|february|march|april|june|july|august|september|october|november|december)/i.test(body);
 add(2,"who",author&&date?"pass":author||date?"warn":"fail","a",{s:author&&date?L.s.whoBoth:author||date?L.s.whoOne:L.s.whoNone});
 // 3 · FAQ
 const fl=faq.split("\n").map(x=>x.trim()).filter(Boolean);let fn=0;
 fl.forEach((x,i)=>{const m=x.match(/^(.*?\?)\s*(.*)$/);if(!m)return;if(words(m[2]).length>=2||(fl[i+1]&&!/\?/.test(fl[i+1])))fn++;});
 add(3,"faq",fn>=3?"pass":fn>=1?"warn":"fail","a",{n:fn});
 // scores
 const every=[...R[1],...R[2],...R[3]],pick=t=>every.filter(c=>c.tags.includes(t));
 const score=(el,a)=>{const ok=a.filter(c=>c.st==="pass").length,wn=a.filter(c=>c.st==="warn").length,m=a.length,pc=(ok+wn/2)/m;
  el.className="score "+(pc>=.8?"good":pc>=.5?"mid":"low");el.querySelector(".num").textContent=ok+" / "+m;
  el.querySelector(".verdict").textContent=fmt(L.rules,{n:m,w:wn})+" "+(pc>=.8?L.v3:pc>=.5?L.v2:L.v1);return ok+"/"+m;};
 const s1=score($("sSeo"),pick("g")),s2=score($("sAi"),pick("a"));
 const tag=t=>(t.includes("g")?`<span class="tag g">${esc(L.forG)}</span>`:"")+(t.includes("a")?`<span class="tag a">${esc(L.forA)}</span>`:"");
 const li=c=>`<li class="${c.st}"><span class="badge">${c.st==="pass"?"✓":c.st==="warn"?"!":"✕"}</span><div><div class="ctitle">${esc(c.title)}${tag(c.tags)}</div><div class="cwhy">${esc(c.why)}</div>${c.tip?`<div class="ctip">${esc(c.tip)}</div>`:""}</div></li>`;
 [1,2,3].forEach(k=>$("l"+k).innerHTML=R[k].map(li).join(""));
 $("chips").innerHTML=kws.map(w=>`<span class="chip ${hits.includes(w)?"hit":"miss"}">${esc(w)}</span>`).join("")||"—";
 $("empty").hidden=true;$("out").hidden=false;
 const fixes=every.filter(c=>c.st!=="pass").map(c=>"- "+c.title+": "+c.tip).join("\n");
 $("copy").dataset.report=`${L.report}\n${L.rq}: ${q}\n${L.rt}: ${title}\n${L.rSeo}: ${s1} · ${L.rAi}: ${s2}\n${L.rFix}:\n${fixes||"—"}`;
 $("aiPrompt").textContent=aiPrompt(L,q,brand,title,intro,body,faq,every.filter(c=>c.st!=="pass"));
 return true;}

const hasVague=z=>{const n=" "+norm(z)+" ";return VAGUE.some(v=>n.includes(" "+norm(v).trim()+" "));};
function aiPrompt(L,q,brand,title,intro,body,faq,fails){
 const es=lang==="es";
 const head=es?`ROL: Sos editor de contenidos web, experto en SEO y en textos que las IA pueden citar.
INPUT: la página de abajo y la pregunta del cliente: "${q}". Marca/producto: ${brand||"[marca]"}.
PASOS: reescribí la página respetando estas reglas que hoy no cumple:`:`ROLE: You are a web content editor, expert in SEO and in writing that AI assistants can quote.
INPUT: the page below and the customer's question: "${q}". Brand/product: ${brand||"[brand]"}.
STEPS: rewrite the page following these rules it misses today:`;
 const tail=es?`EXPECTATION: devolvé título, resumen inicial (2–3 frases, menos de 60 palabras, la marca en la primera frase), artículo con subtítulos en forma de pregunta y una respuesta corta debajo de cada uno, datos en listas, firma y fecha, y 3–5 preguntas frecuentes con respuesta.
NARROWING: usá SOLO los datos que están en el texto. Si falta un dato, escribí [FALTA: …] en lugar de inventarlo. Mismo idioma de la página. Sin palabras de marketing vacías.`:`EXPECTATION: return a title, a summary at the top (2–3 sentences, under 60 words, brand in the first sentence), an article with question headings and a short answer under each, facts in lists, author and date, and 3–5 FAQ with answers.
NARROWING: use ONLY facts that are in the text. If a fact is missing, write [MISSING: …] instead of inventing it. Keep the page's language. No empty marketing words.`;
 const rules=fails.length?fails.map(c=>"- "+c.title+": "+c.tip).join("\n"):(es?"- (ya cumple todas: mejorá solo la claridad)":"- (it already passes all: improve clarity only)");
 return `${head}\n${rules}\n${tail}\n\n--- ${es?"PÁGINA":"PAGE"} ---\n${title}\n\n${intro}\n\n${body}\n\nFAQ\n${faq}`;}

const F=["q","brand","title","intro","body","faq"];
function fill(e){F.forEach(k=>$(k).value=e[k]);tCount();run();}
$("run").onclick=()=>{if(run()&&window.innerWidth<900)$("out").scrollIntoView({behavior:"smooth"});};
$("exBad").onclick=()=>fill(EX.bad);$("exGood").onclick=()=>fill(EX.good);
$("clear").onclick=()=>{F.forEach(k=>$(k).value="");tCount();$("out").hidden=true;$("empty").hidden=false;};
$("title").addEventListener("input",tCount);
$("copy").onclick=async()=>{const r=$("copy").dataset.report||"";try{await navigator.clipboard.writeText(r)}catch(e){const t=document.createElement("textarea");t.value=r;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove();}
 $("copied").hidden=false;setTimeout(()=>$("copied").hidden=true,1800);};
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
let saved="en";try{saved=localStorage.getItem("fc-lang")||"en"}catch(e){}
if(location.hash==="#es")saved="es";if(location.hash==="#en")saved="en";
setLang(saved);
</script>
</body>
</html>
